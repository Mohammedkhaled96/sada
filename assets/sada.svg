<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
     width="1024" height="1024" role="img" aria-label="Sada">
  <title>Sada</title>
  <desc>A sound waveform running into the corner of a document page.</desc>

  <rect width="1024" height="1024" rx="122" fill="#1E3A8A"/>

  <!-- the page, with its top-right corner cut away -->
  <path d="M 499 149
           H 737
           L 926 338
           V 830
           a 44 44 0 0 1 -44 44
           H 499
           a 44 44 0 0 1 -44 -44
           V 193
           a 44 44 0 0 1 44 -44 Z"
        fill="#F8FAFC"/>

  <!-- the waveform, the last bar crossing into the page -->
  <g>
    <rect x="97" y="382" width="100" height="260" rx="50" fill="#F59E0B"/>
    <rect x="270" y="277" width="100" height="470" rx="50" fill="#F59E0B"/>
    <rect x="443" y="336" width="100" height="352" rx="50" fill="#F59E0B"/>
  </g>
</svg>
