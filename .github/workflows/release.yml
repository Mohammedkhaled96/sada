name: Release

# Builds the Windows installer and attaches it to the GitHub release, so a
# release is produced from the tagged source rather than from a developer's
# machine. Publishing the release then triggers winget.yml.
#
# Prerequisites in the repository: assets/sada.ico (referenced by Sada.spec).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installer & publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller

      # ffmpeg does all the decoding and is shipped inside the application, but
      # the binary is 100 MB+ and is deliberately not in the repository, so the
      # build has to fetch it. Without this the spec stops with "bin/ffmpeg.exe
      # is missing" and nothing is ever published.
      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $dir = "$env:RUNNER_TEMP\ffmpeg"
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe was not found in the downloaded archive' }
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item $exe.FullName 'bin\ffmpeg.exe' -Force
          "{0:N0} MB" -f ((Get-Item 'bin\ffmpeg.exe').Length / 1MB)

      - name: Build the application
        run: python -m PyInstaller Sada.spec --noconfirm

      # /O overrides the OutputDir in the script, so the installer lands in
      # release\ no matter what installer\Sada.iss says. Without it the two
      # disagreed and the hashing step below found nothing.
      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $out = Join-Path $PWD.Path 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc "/O$out" 'installer\Sada.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Hash the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\Sada-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw 'no installer produced' }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$sha  $($exe.Name)" | Out-File 'release\SHA256SUMS.txt' -Encoding ascii
          # The winget manifest must carry exactly this hash.
          "### Installer" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "``$($exe.Name)`` - SHA256 ``$sha``" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Sada-Setup-*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Sada-installer
          path: |
            release/Sada-Setup-*.exe
            release/SHA256SUMS.txt
          retention-days: 14
