name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax, lint & manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The runtime dependencies are Windows-only (wxPython, pywin32) and torch
      # is a ~200 MB download, so CI checks what can be checked without them:
      # every module must parse, and real errors must be absent.
      - name: Byte-compile every module
        run: python -m compileall -q app engine tools tests

      - name: Lint for real errors only
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 --output-format=github .

      # The text pipeline needs numpy and ffmpeg and nothing else, so it can
      # run here. It is the part worth running: engine/cleanup.py and
      # engine/fillers.py were once complete, tested and connected to nothing,
      # and compileall had no opinion about it.
      - name: Install what the text tests need
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install numpy

      - name: Text pipeline tests
        run: python tests/test_text.py
        env:
          PYTHONUTF8: '1'
          # Keep the log and any scratch output away from the checkout.
          SADA_STATE_DIR: ${{ runner.temp }}/sada-state

      - name: Validate the winget manifests
        run: |
          pip install pyyaml
          python tools/validate_winget.py
