version: 2
updates:
  # pip version updates are intentionally NOT enabled. requirements.txt uses
  # deliberate lower bounds (">=") rather than pins, so a "bump the floor" PR
  # changes nothing at install time while locking out users on an older but
  # working release. Real vulnerabilities still arrive through Dependabot
  # security updates, which are enabled in the repository settings.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
