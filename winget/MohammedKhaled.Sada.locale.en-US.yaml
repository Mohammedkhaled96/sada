ShortDescription: Offline speech-to-text for Microsoft Word. Transcribes audio and video into your document with a keyboard shortcut, with no subscription and no upload.

Description: |-
  Sada turns an audio or video recording into written text inside the Microsoft
  Word document you already have open. Press a shortcut, pick a file, and the
  transcript is inserted at your cursor.

  Everything runs on your own machine. The audio is never uploaded, no account
  or API key is needed, there is no limit on minutes or file size, and it works
  offline once a speech model has been downloaded.

  Features:
  - Detects the language automatically, across more than ninety languages, by
    sampling several windows from the recording and voting on the result, so a
    file that opens with music or a greeting in another language is still read
    correctly.
  - Handles recordings of any length. Progress is written to disk continuously,
    so an interrupted file resumes from where it stopped rather than restarting.
  - Queues several files, and cancelling one never blocks starting another.
  - Inserts into Word as a single undo, sets right-to-left reading order for
    Arabic, and leaves the cursor at the start of the new text.
  - Interface in English or Arabic, switchable in settings.
  - Built to be fully usable from the keyboard and with the NVDA and JAWS screen
    readers.

  No speech model is included in the installer. After installing, open settings
  and download the model you want; it is stored under your user profile, so
  upgrading or reinstalling never downloads it again.

  Based on OpenAI's Whisper. Requires Microsoft Word 2016 or newer, and about
  6 GB of RAM while transcribing.

