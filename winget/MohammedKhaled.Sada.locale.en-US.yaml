ReleaseNotes: |-
  An application icon, and fixes to the model settings that mattered most for
  screen reader users.

  - Sada now has a proper icon, on the window, the tray, the installer and in
    Add or remove programs
  - Keyboard shortcut fields in settings announce which command they belong to.
    They used to read out only the keys, so "Ctrl Shift T" gave no clue what it
    would do
  - Downloading a model shows real progress: amount, percentage, measured speed
    and time remaining, spoken at every ten percent and readable at any moment
  - Deleting a model now confirms that it happened, and says why if it did not.
    Success and failure were previously both silent
  - Fixed deleting the wrong model: after a download the list quietly moved the
    selection back to the configured model
  - An installed copy keeps its model under the user profile, so upgrading no
    longer throws away a download of up to 1.5 GB
  - Leftovers from a cancelled download are cleared at startup

