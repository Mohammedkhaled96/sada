ReleaseNotes: |-
  One install location, and a model that is never downloaded twice.

  People who had already downloaded the speech model found that a new version
  could not see it, and had to wait out the 1.5 GB again. There were two
  reasons and both are fixed.

  - The installer no longer offers to install for all users. That option
    restarted Setup with administrator rights, where %LocalAppData% means the
    administrator's profile rather than yours - so Sada installed under one
    account and ran as another, looking for the model in a folder nothing had
    written to. It also put the "start with Windows" shortcut in the wrong
    profile. Sada installs for you only, in one folder, for every update.
  - The model file is now looked for in every folder it could reasonably be
    in, and used from wherever it is. Before, a checkpoint one folder away was
    indistinguishable from no checkpoint at all, and the download started
    again with nothing asked.
  - Settings names the folder in full, in a field a screen reader can be moved
    into, and lists every model file in it. "Find my model" says exactly which
    folders were searched and what was found in them. There is also a button
    to keep the models somewhere else entirely, for anyone who would rather
    not have 3 GB on their system drive.
  - The folder cleanup that runs at startup used to delete a whole directory.
    It removes only the stale settings file now, and only if nothing else is
    beside it. No model file is ever moved or deleted without saying so.
  - The Settings window scrolls. On a short screen its Save button was being
    squeezed to nothing.

  Nothing about this release changes where your existing settings or models
  are kept, and updating does not re-download anything.
ReleaseNotesUrl: https://github.com/Mohammedkhaled96/sada/releases/tag/v1.1.2

